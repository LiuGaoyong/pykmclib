# @package _global_
#
# The ZGB model of zgb.py for the `pykmclib` command.  Run it from the
# directory of zgb.py, so that the functions and classes of that file can be
# imported:
#
#   cd examples/zgb
#   python -m pykmclib.cli --config-dir conf model=zgb
#   python -m pykmclib.cli -m --config-dir conf model=zgb model.interactions.y=0.35,0.45,0.50,0.55
model:
  configuration:
    _target_: zgb.build_configuration
    size: 40
  interactions:
    _target_: zgb.build_interactions
    y: 0.45                 # the fraction of CO in the gas
    reaction_rate: 1000.0
  rate_calculator: null

control:
  number_of_steps: 200000
  dump_interval: 20000
  seed: 2014

analysis:
  # The number of particles of each type, averaged over blocks of 5 time
  # units; written to analysis_0_Composition.txt.
  - _target_: pykmclib.Composition
    time_interval: 5.0
  # The CO2 production rate over the second half of the run; written to
  # analysis_1_EventCounter.txt.
  - _target_: zgb.EventCounter
    skip_steps: 100000

# Stop as soon as the surface is covered by one species.
breakers:
  - _target_: zgb.Poisoned
