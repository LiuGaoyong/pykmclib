# conda-forge recipe draft for pykmclib
#
# This is the file you copy into a pull request against
# https://github.com/conda-forge/staged-recipes (recipes/pykmclib/meta.yaml).
# It builds from the self-contained PyPI sdist, which ships the vendored
# KMCLib C++ sources (third_party/KMCLib) and the md5 tarball.
#
# Fill in `sha256` after the first upload to PyPI:
#   curl -sL https://pypi.org/pypi/pykmclib/json | \
#     python -c "import json,sys; d=json.load(sys.stdin); \
#                print([f['digests']['sha256'] for f in d['urls'] if f['packagetype']=='sdist'][0])"
{% set name = "pykmclib" %}
{% set version = "0.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: PLACEHOLDER_SHA256

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake >=3.21
    - ninja
  host:
    - python
    - pip
    - scikit-build-core >=1.1
    - pybind11 >=3.0
    - numpy >=1.21
  run:
    - python
    - numpy >=1.21

test:
  imports:
    - pykmclib
    - pykmclib.Backend
  commands:
    - python -c "from pykmclib.Backend import Backend, Custom; assert Backend.MPICommons.isMaster()"
    - pytest -q tests
  requires:
    - pytest
  source_files:
    - tests

about:
  home: https://github.com/LiuGaoyong/pykmclib
  summary: Lattice kinetic Monte Carlo simulations (Python front end, C++ backend)
  description: |
    pykmclib repackages KMCLib, the general framework for lattice kinetic Monte
    Carlo simulations, as a modern Python distribution built with
    scikit-build-core and pybind11. The computationally heavy backend is the
    original KMCLib C++ code; the Python API follows upstream KMCLib.
  license: GPL-3.0-or-later
  license_file:
    - LICENSE
    - third_party/KMCLib/LICENSE.txt
  doc_url: https://github.com/LiuGaoyong/pykmclib
  dev_url: https://github.com/LiuGaoyong/pykmclib

extra:
  recipe-maintainers:
    - LiuGaoyong
