name: Wheels

on:
  push:
  pull_request:
    paths:
      - ".github/workflows/wheels.yml"
      - "pyproject.toml"
      - "cxx/**"
      - "third_party/KMCLib/**"
  workflow_dispatch:

env:
  CIBUILDWHEEL_VERSION: "4.3.5"

jobs:
  build_wheels:
    name: wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: both manylinux flavours for both architectures.  The arm64
          # builds run on native runners, not under QEMU.
          - { name: linux-x86_64-manylinux2014, os: ubuntu-latest, arch: x86_64, manylinux: manylinux2014 }
          - { name: linux-x86_64-manylinux_2_28, os: ubuntu-latest, arch: x86_64, manylinux: manylinux_2_28 }
          - { name: linux-aarch64-manylinux2014, os: ubuntu-24.04-arm, arch: aarch64, manylinux: manylinux2014 }
          - { name: linux-aarch64-manylinux_2_28, os: ubuntu-24.04-arm, arch: aarch64, manylinux: manylinux_2_28 }
          # macOS: one native runner per architecture.  The deployment target
          # is pinned so that the C++17 standard library is fully available.
          - { name: macos-x86_64, os: macos-15-intel, arch: x86_64, macos_target: "10.15" }
          - { name: macos-arm64, os: macos-15, arch: arm64, macos_target: "11.0" }
          - { name: windows-x86_64, os: windows-latest, arch: AMD64 }
    env:
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.manylinux || 'manylinux_2_28' }}
      CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.manylinux || 'manylinux_2_28' }}
      # numpy publishes no manylinux2014 wheel for CPython 3.14, so that wheel
      # is built but cannot be tested inside the manylinux2014 image.
      CIBW_TEST_SKIP: ${{ matrix.manylinux == 'manylinux2014' && 'cp314-*' || '' }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build the wheels
        run: uvx cibuildwheel==${{ env.CIBUILDWHEEL_VERSION }} --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Release jobs (tags only).  Both wait for every wheel and the sdist, and
  # neither runs unless the tag matches the version in the package.
  check_tag:
    name: tag matches __version__
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pykmclib/__init__.py)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match __version__ = \"${version}\""
            exit 1
          fi

  publish:
    name: publish to PyPI
    needs: [check_tag, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: upload to the GitHub release
    needs: [check_tag, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and attach files to it
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Create the release, or reuse the one that already exists
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          flags="--verify-tag --generate-notes"
          # PEP 440 pre-releases (a, b, rc, .dev) become GitHub pre-releases.
          if echo "${GITHUB_REF_NAME}" | grep -Eq '(a|b|rc|\.dev)[0-9]+$'; then
            flags="${flags} --prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" --title "pykmclib ${GITHUB_REF_NAME#v}" ${flags}

      - name: Attach the wheels and the sdist
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
